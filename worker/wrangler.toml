name = "apollo-review-proxy"
main = "review-backend.js"
compatibility_date = "2026-05-25"
# Account that owns this Worker (public identifier, not a secret). Pinning it
# skips wrangler's account auto-discovery, which errors when the login is tied
# to multiple accounts.
account_id = "8f69ef9e8e9d3ebcb21a975eb9ad4c4a"

# Review state lives in Cloudflare KV — one JSON blob per attachment. No
# external database, no extra account. The binding name `REVIEWS` is what the
# Worker reads at runtime (env.REVIEWS).
[[kv_namespaces]]
binding = "REVIEWS"
id = "7df97f52ff4a44adb5350da248a25729"

# No secrets needed — the backend is pure KV. Deploy with:
#   npx wrangler deploy
