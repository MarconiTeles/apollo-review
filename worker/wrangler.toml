name = "apollo-review-proxy"
main = "review-backend.js"
compatibility_date = "2026-05-25"
# Account that owns this Worker (public identifier, not a secret). Pinning it
# skips wrangler's account auto-discovery, which errors when the login is tied
# to multiple accounts.
account_id = "8f69ef9e8e9d3ebcb21a975eb9ad4c4a"

# Review state: D1 is the PRIMARY store (one row per review, whole JSON doc,
# mirroring the KV key exactly). KV remains as read-fallback for not-yet-
# migrated docs, as a write mirror during the transition (lossless rollback)
# and as cold backup afterwards. If the DB binding is absent the Worker
# degrades to the pure-KV behaviour — a misconfigured deploy breaks nothing.
[[d1_databases]]
binding = "DB"
database_name = "apollo-review"
database_id = "bd9ed433-9519-486d-bf3b-ed6184401537"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "REVIEWS"
id = "7df97f52ff4a44adb5350da248a25729"

# No secrets needed. Deploy with:
#   npx wrangler deploy
